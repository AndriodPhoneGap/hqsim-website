<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 芯智纪元 XINZHI ERA</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #04060d;
        color: #dbe4f2;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(34, 211, 238, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .glow {
        position: absolute;
        width: 720px;
        height: 480px;
        border-radius: 999px;
        background: rgba(34, 211, 238, 0.1);
        filter: blur(120px);
      }
      .box { position: relative; text-align: center; padding: 32px; }
      .code {
        font-family: "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: clamp(72px, 16vw, 148px);
        line-height: 1;
        font-weight: 700;
        background: linear-gradient(90deg, #5ee9ff, #22d3ee, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { margin: 18px 0 10px; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
      p { margin: 0 0 28px; color: #8b9bb4; font-size: 14px; line-height: 1.7; }
      a {
        display: inline-block;
        padding: 12px 30px;
        border-radius: 999px;
        background: #22d3ee;
        color: #04060d;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      a:hover { transform: translateY(-2px); box-shadow: 0 0 40px -12px rgba(34, 211, 238, 0.6); }
      .mono {
        margin-top: 26px;
        font-family: "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(139, 155, 180, 0.65);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="box">
      <div class="code">404</div>
      <h1>该页面不存在</h1>
      <p>您访问的地址可能已被移除或重命名。<br />返回首页继续浏览芯智纪元的产品与技术架构。</p>
      <a href="./">返回首页</a>
      <div class="mono">XINZHI ERA · 404 NOT FOUND</div>
    </div>
  </body>
</html>
