    <linearGradient id="xze-qr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ee9ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="xze-qr-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#22d3ee" fill-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="320" height="320" rx="20" fill="url(#xze-qr-bg)"/>
