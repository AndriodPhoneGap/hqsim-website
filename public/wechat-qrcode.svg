<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="微信公众号二维码占位图">
  <defs>
    <linearGradient id="xze-qr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1528"/>
      <stop offset="100%" stop-color="#070b16"/>
